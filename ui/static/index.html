<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Qwen3.8-27B playground</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--fg:#e6e8ef;--mut:#8b93a7;--acc:#7c9cff;--think:#c9a86a;--ok:#4cc38a;--err:#ef6b73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Inter,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:15px}header .st{color:var(--mut);font-size:12px;margin-left:auto}
nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:5px 10px;border-radius:6px;cursor:pointer}nav button.on{background:var(--acc);color:#000;border-color:var(--acc)}
main{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
aside{border-right:1px solid var(--line);padding:14px;overflow:auto;background:var(--panel)}
aside label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}aside select,aside input,aside textarea{width:100%;background:#0d0f15;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px}
aside textarea{min-height:70px;resize:vertical}aside .row{display:flex;gap:8px;align-items:center}aside .row input[type=checkbox]{width:auto}
#chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;padding:16px 20px}
.msg{max-width:900px;margin:0 auto 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.msg.user{border-color:#2f3b5e;background:#161c2e}.msg .who{font-size:11px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.think{border-left:3px solid var(--think);background:#1a1810;color:#d8c9a3;padding:8px 10px;border-radius:6px;margin:6px 0;white-space:pre-wrap;font-size:13px;max-height:260px;overflow:auto}
.think summary{cursor:pointer;color:var(--think);font-weight:600;list-style:none}
.tool{border-left:3px solid var(--acc);background:#121a2e;padding:6px 10px;border-radius:6px;margin:6px 0;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap}
.stats{color:var(--mut);font-size:11px;margin-top:6px}.err{color:var(--err)}
.md pre{background:#0d0f15;padding:10px;border-radius:6px;overflow:auto}.md code{background:#0d0f15;padding:1px 4px;border-radius:4px}.md p{margin:.4em 0}
.msg img{max-width:280px;border-radius:6px;display:block;margin:6px 0}
footer{border-top:1px solid var(--line);padding:12px 20px;background:var(--panel)}
.box{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.box textarea{flex:1;background:#0d0f15;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;min-height:44px;max-height:200px;resize:vertical}
.box button{background:var(--acc);color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}.box button.stop{background:var(--err);color:#fff}
.box .att{background:none;border:1px solid var(--line);color:var(--fg)}
#thumbs{max-width:900px;margin:0 auto 6px;display:flex;gap:6px}#thumbs img{height:48px;border-radius:4px;border:1px solid var(--line)}
#results{padding:20px;overflow:auto}table{border-collapse:collapse;width:100%;max-width:1000px}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mut)}tr.c{cursor:pointer}tr.c:hover{background:var(--panel)}
#detail .case{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--panel)}#detail pre{white-space:pre-wrap;font-size:12px;background:#0d0f15;padding:8px;border-radius:6px;max-height:300px;overflow:auto}
.hide{display:none}
</style></head><body>
<header><b>Qwen3.8-27B playground</b>
<nav><button id="tabChat" class="on">Chat</button><button id="tabRes">Workload results</button></nav>
<span class="st" id="status">connecting…</span></header>
<main>
<aside>
  <label>Thinking</label>
  <select id="mode"><option value="off">off (fast)</option><option value="low">low</option><option value="medium">medium</option><option value="xhigh">xhigh (default for this model)</option></select>
  <label>Max tokens per reply</label><input id="maxtok" type="number" value="4096">
  <label>Temperature (blank = mode default: 0.7 off / 1.0 thinking)</label><input id="temp" type="number" step="0.1" placeholder="auto">
  <label>System prompt</label><textarea id="system" placeholder="optional"></textarea>
  <label class="row"><input id="tools" type="checkbox"> Demo tools (weather, currency, calculator)</label>
  <label class="row"><input id="showthink" type="checkbox" checked> Show thinking live</label>
  <label>&nbsp;</label><button id="clear" style="width:100%;background:none;border:1px solid var(--line);color:var(--fg);padding:6px;border-radius:6px;cursor:pointer">Clear conversation</button>
  <p style="color:var(--mut);font-size:11px;margin-top:16px">Tip: attach a screenshot, chart or document photo and ask about it. One image per message (server limit for now).</p>
</aside>
<section id="chat">
  <div id="log"></div>
  <footer><div id="thumbs"></div><div class="box">
    <button class="att" id="attach" title="Attach image">🖼</button><input id="file" type="file" accept="image/*" class="hide">
    <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button></div></footer>
</section>
<section id="results" class="hide"><div id="rtable"></div><div id="detail"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);const log=$('#log');let history=[],pendingImg=null,ctrl=null;
marked.setOptions({breaks:true});
fetch('/api/info').then(r=>r.json()).then(i=>{$('#status').textContent=i.ok?`${i.served} · ctx ${i.max_model_len} · ${i.base_url.replace('https://','')}`:'endpoint unreachable: '+i.error;if(!i.ok)$('#status').classList.add('err')});
$('#tabChat').onclick=()=>{$('#chat').classList.remove('hide');$('#results').classList.add('hide');$('#tabChat').classList.add('on');$('#tabRes').classList.remove('on')};
$('#tabRes').onclick=()=>{$('#chat').classList.add('hide');$('#results').classList.remove('hide');$('#tabRes').classList.add('on');$('#tabChat').classList.remove('on');loadResults()};
$('#attach').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{pendingImg=rd.result;$('#thumbs').innerHTML=`<img src="${pendingImg}" title="attached">`};rd.readAsDataURL(f);e.target.value=''};
$('#clear').onclick=()=>{history=[];log.innerHTML=''};
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#send').onclick=()=>ctrl?ctrl.abort():send();
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
function addUser(text,img){const m=el(`<div class="msg user"><div class="who">you</div>${img?`<img src="${img}">`:''}<div class="md"></div></div>`);m.querySelector('.md').textContent=text;log.appendChild(m);log.scrollTop=log.scrollHeight}
async function send(){
  const text=$('#input').value.trim();if(!text&&!pendingImg)return;
  const content=pendingImg?[{type:'image_url',image_url:{url:pendingImg}},{type:'text',text}]:text;
  addUser(text,pendingImg);pendingImg=null;$('#thumbs').innerHTML='';$('#input').value='';
  history.push({role:'user',content});
  const m=el(`<div class="msg"><div class="who">qwen3.8-27b · ${$('#mode').value}</div><details class="think hide" open><summary>thinking…</summary><div class="tt"></div></details><div class="tools"></div><div class="md"></div><div class="stats"></div></div>`);
  log.appendChild(m);const tt=m.querySelector('.tt'),md=m.querySelector('.md'),st=m.querySelector('.stats'),th=m.querySelector('.think'),tools=m.querySelector('.tools');
  let answer='',think='';$('#send').textContent='Stop';$('#send').classList.add('stop');ctrl=new AbortController();
  const body={messages:history,thinking:$('#mode').value,max_tokens:+$('#maxtok').value,tools:$('#tools').checked,system:$('#system').value||null,temperature:$('#temp').value===''?null:+$('#temp').value};
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);const ev=/event: (\w+)/.exec(blk)?.[1];const data=JSON.parse(/data: (.*)/s.exec(blk)[1]);
        if(ev==='reasoning'){think+=data.t;if($('#showthink').checked){th.classList.remove('hide');tt.textContent=think;tt.scrollTop=tt.scrollHeight}}
        else if(ev==='content'){answer+=data.t;md.innerHTML=marked.parse(answer)}
        else if(ev==='tool_call'){tools.appendChild(el(`<div class="tool">🔧 ${data.name}(${JSON.stringify(data.args)})\n→ ${JSON.stringify(data.result)}</div>`))}
        else if(ev==='ttft'){st.textContent=`first token ${data.s.toFixed(2)}s…`}
        else if(ev==='error'){md.innerHTML+=`<p class="err">${data.message}</p>`}
        else if(ev==='done'){th.querySelector('summary').textContent=`thinking (${data.reasoning_chars} chars)`;if(!think)th.classList.add('hide');
          st.textContent=`${data.total_s.toFixed(1)}s total · TTFT ${data.ttft_s?.toFixed(2)}s · ${data.completion_tokens} tokens out · ${data.tok_per_s?.toFixed(0)} tok/s · ${data.prompt_tokens} in`}
        log.scrollTop=log.scrollHeight}}
  }catch(e){if(e.name!=='AbortError')md.innerHTML+=`<p class="err">${e}</p>`;else st.textContent+=' (stopped)'}
  history.push({role:'assistant',content:answer});ctrl=null;$('#send').textContent='Send';$('#send').classList.remove('stop');
}
async function loadResults(){const rows=await (await fetch('/api/results')).json();
  $('#rtable').innerHTML=rows.length?`<table><tr><th>workload</th><th>cases</th><th>passed/scored</th><th>avg latency (s)</th></tr>${rows.map(r=>`<tr class="c" data-w="${r.workload}"><td>${r.workload}</td><td>${r.cases}</td><td>${r.passed}/${r.scored}</td><td>${r.avg_latency_s}</td></tr>`).join('')}</table>`:'<p>No results yet. Run <code>python run_all.py</code>.</p>';
  document.querySelectorAll('tr.c').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.w))}
async function showDetail(w){const rows=await (await fetch('/api/results/'+w)).json();
  $('#detail').innerHTML=`<h3>${w}</h3>`+rows.filter(r=>r.case).map(r=>`<div class="case"><b>${r.ok===true?'✅':r.ok===false?'❌':'➖'} ${r.case}</b> <span style="color:var(--mut)">${(r.latency_s||0).toFixed(1)}s ${r.note?'· '+r.note:''}</span><pre>${escape(typeof r.output==='string'?r.output:JSON.stringify(r.output,null,1))}${r.error?'\n'+r.error:''}</pre></div>`).join('')}
function escape(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script></body></html>
